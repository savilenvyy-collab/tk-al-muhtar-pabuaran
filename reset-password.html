<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Ulang Password - TK AL-Muhtar Pabuaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>TK AL-Muhtar Pabuaran</h1>
        <p>Pemulihan Password Akun</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Password Baru 🔑</h2>
            <p>Masukkan password baru untuk akun Anda.</p>

            <p id="resetMessage" class="recovery-message" role="status">
                Memeriksa tautan pemulihan...
            </p>

            <form id="resetPasswordForm" class="forgot-password-form" hidden>
                <div class="login-field">
                    <label for="passwordBaru">Password Baru</label>
                    <input
                        type="password"
                        id="passwordBaru"
                        minlength="8"
                        maxlength="256"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="konfirmasiPassword">Konfirmasi Password Baru</label>
                    <input
                        type="password"
                        id="konfirmasiPassword"
                        minlength="8"
                        maxlength="256"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Simpan Password Baru
                </button>
            </form>

            <p><a href="login.html">Kembali ke Login</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 TK AL-Muhtar Pabuaran</p>
    </footer>

    <script type="module">
        import { createClient } from
            "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL =
            "https://ianbedmbrrmqhbpbbvnr.supabase.co";
        const SUPABASE_KEY =
            "sb_publishable_vgmD7EpEDgzSSHZout_7FQ_civgvMQ8";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById("resetPasswordForm");
        const passwordBaru =
            document.getElementById("passwordBaru");
        const konfirmasiPassword =
            document.getElementById("konfirmasiPassword");
        const message =
            document.getElementById("resetMessage");

        async function periksaSesiPemulihan() {
            try {
                const params =
                    new URLSearchParams(window.location.search);

                if (params.get("code")) {
                    const { error } =
                        await supabase.auth.exchangeCodeForSession(
                            params.get("code")
                        );

                    if (error) throw error;
                }

                const { data: { session }, error } =
                    await supabase.auth.getSession();

                if (error) throw error;

                if (!session) {
                    throw new Error(
                        "Tautan pemulihan tidak valid atau sudah kedaluwarsa."
                    );
                }

                message.textContent =
                    "Silakan buat password baru.";
                form.hidden = false;
                passwordBaru.focus();
            } catch (error) {
                message.textContent =
                    "Gagal memeriksa tautan pemulihan: " +
                    error.message;
                form.hidden = true;
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (passwordBaru.value !== konfirmasiPassword.value) {
                message.textContent =
                    "Konfirmasi password tidak sama.";
                return;
            }

            const button =
                form.querySelector("button[type='submit']");
            button.disabled = true;
            message.textContent = "Menyimpan password baru...";

            try {
                const { error } =
                    await supabase.auth.updateUser({
                        password: passwordBaru.value
                    });

                if (error) throw error;

                message.textContent =
                    "Password berhasil diperbarui. Anda dapat login kembali.";
                form.reset();
                form.hidden = true;

                setTimeout(() => {
                    window.location.replace("login.html");
                }, 2500);
            } catch (error) {
                message.textContent =
                    "Gagal memperbarui password: " + error.message;
            } finally {
                button.disabled = false;
            }
        });

        await periksaSesiPemulihan();
    </script>
</body>
</html>
